<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Client — Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #08080c; color: #e0e0e0; min-height: 100vh;
}
a { color: #60a5fa; text-decoration: none; }
::placeholder { color: rgba(255,255,255,0.15); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

/* Login */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 48px; width: 360px; text-align: center;
}
.login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.login-card p { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 28px; }
.login-card input {
  width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #e0e0e0;
  outline: none; margin-bottom: 14px;
}
.login-card input:focus { border-color: rgba(255,255,255,0.25); }
.login-card button {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  background: rgba(255,255,255,0.9); color: #08080c; font-size: 14px;
  font-weight: 600; cursor: pointer;
}
.login-card button:hover { background: #fff; }
.login-card .error { font-size: 12px; color: #f87171; margin-top: 10px; }

/* Layout */
.admin-wrap { display: flex; min-height: 100vh; }
.sidebar {
  width: 220px; flex-shrink: 0; background: rgba(255,255,255,0.02);
  border-right: 1px solid rgba(255,255,255,0.06); padding: 0;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 15px; font-weight: 700;
}
.sidebar-nav { flex: 1; padding: 8px; }
.sidebar-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: none; background: transparent; color: rgba(255,255,255,0.4);
  font-size: 13px; cursor: pointer; transition: all 0.12s; text-align: left;
}
.sidebar-btn:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); }
.sidebar-btn.active { background: rgba(255,255,255,0.06); color: #e0e0e0; }
.sidebar-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-logout {
  padding: 16px; border-top: 1px solid rgba(255,255,255,0.06);
}
.sidebar-logout button {
  width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
  background: transparent; color: rgba(255,255,255,0.3); font-size: 12px; cursor: pointer;
}
.sidebar-logout button:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); }

.main-content { flex: 1; padding: 28px 32px; overflow-y: auto; max-height: 100vh; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 32px; }
.stat-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 20px;
}
.stat-card .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; }

/* Table / cards */
.list-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.list-header h3 { font-size: 16px; font-weight: 600; }
.btn {
  padding: 8px 18px; border-radius: 8px; border: none; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.12s;
}
.btn-primary { background: rgba(255,255,255,0.9); color: #08080c; }
.btn-primary:hover { background: #fff; }
.btn-danger { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
.btn-danger:hover { background: rgba(248,113,113,0.25); }
.btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 6px; }

.card-list { display: flex; flex-direction: column; gap: 8px; }
.card-row {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 14px 16px; transition: background 0.1s;
}
.card-row:hover { background: rgba(255,255,255,0.04); }

/* Version grid */
.ver-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ver-card {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; overflow: hidden;
}
.ver-card-preview {
  width: 100%; height: 120px; background: rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: rgba(255,255,255,0.15);
  background-size: cover; background-position: center;
}
.ver-card-body { padding: 12px 14px; }
.ver-card-body h4 { font-size: 14px; font-weight: 600; }
.ver-card-body p { font-size: 11px; color: rgba(255,255,255,0.3); margin: 2px 0 10px; }
.ver-actions { display: flex; gap: 6px; }
.ver-actions label {
  flex: 1; padding: 6px 0; border-radius: 6px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  font-size: 11px; text-align: center; cursor: pointer; transition: all 0.12s;
}
.ver-actions label:hover { background: rgba(255,255,255,0.08); }
.ver-actions input[type="file"] { display: none; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.4); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #e0e0e0;
  outline: none; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: rgba(255,255,255,0.25); }
.form-group textarea { min-height: 120px; resize: vertical; }
.form-actions { display: flex; gap: 8px; }

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: #0e0e14; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 28px; width: 480px; max-width: 90vw;
  max-height: 85vh; overflow-y: auto;
}
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 18px; }

.empty-state { text-align: center; padding: 40px 0; color: rgba(255,255,255,0.15); }
.empty-state p { font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.origin
let token = null
let currentTab = 'dashboard'

async function api(method, path, bodyData) {
  const headers = { 'Content-Type': 'application/json' }
  if (token) headers['Authorization'] = `Bearer ${token}`
  const opts = { method, headers }
  if (bodyData) opts.body = JSON.stringify(bodyData)
  try {
    const r = await fetch(`${API}${path}`, opts)
    const d = await r.json()
    if (!r.ok && d.error === 'unauthorized') { token = null; sessionStorage.removeItem('admin_token'); render() }
    return d
  } catch (e) {
    return { error: 'Network error: ' + e.message }
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

/* ── Login ── */
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div style="width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px">🎮</div>
        <h1>String Client</h1>
        <p>Admin Panel</p>
        <a href="${API}/api/admin/auth/discord" style="display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:12px;background:#5865f2;color:#fff;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:16px;transition:background .15s" onmouseover="this.style.background='#4752c4'" onmouseout="this.style.background='#5865f2'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Login with Discord
        </a>
        <div style="position:relative;margin:12px 0"><div style="border-top:1px solid rgba(255,255,255,0.06)"></div><span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#08080c;padding:0 12px;font-size:11px;color:rgba(255,255,255,0.15)">or</span></div>
        <input id="login-pass" type="password" placeholder="Password (fallback)" style="margin-top:4px" />
        <button onclick="loginPassword()" style="margin-top:4px">Sign In with Password</button>
        <div id="login-error" class="error"></div>
      </div>
    </div>
  `
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') loginPassword() })
}

async function loginPassword() {
  const password = document.getElementById('login-pass').value
  const r = await api('POST', '/api/admin/login', { password })
  if (r.token) {
    token = r.token; sessionStorage.setItem('admin_token', token); render()
  } else {
    document.getElementById('login-error').textContent = 'Wrong password'
  }
}

/* ── Layout ── */
function renderLayout() {
  const tabs = [
    { id: 'dashboard', label: 'Dashboard', icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>' },
    { id: 'versions', label: 'Versions', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>' },
    { id: 'players', label: 'Players', icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>' },
    { id: 'blog', label: 'Blog', icon: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
    { id: 'news', label: 'News', icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
  ]
  document.getElementById('app').innerHTML = `
    <div class="admin-wrap">
      <div class="sidebar">
        <div class="sidebar-header">String Admin</div>
        <div class="sidebar-nav">
          ${tabs.map(t => `
            <button class="sidebar-btn${currentTab === t.id ? ' active' : ''}" onclick="switchTab('${t.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${t.icon}</svg>
              ${t.label}
            </button>
          `).join('')}
        </div>
        <div class="sidebar-logout">
          <button onclick="logout()">Log out</button>
        </div>
      </div>
      <div class="main-content" id="main-content"></div>
    </div>
  `
}

function switchTab(tab) { currentTab = tab; renderMain() }
function logout() { token = null; sessionStorage.removeItem('admin_token'); render() }

/* ── Render ── */
async function render() {
  if (!token) {
    // Check URL hash for token from Discord OAuth2 redirect
    const hash = window.location.hash.slice(1)
    const params = new URLSearchParams(hash)
    if (params.get('token')) {
      token = params.get('token')
      sessionStorage.setItem('admin_token', token)
      window.location.hash = ''
      history.replaceState(null, '', '/admin')
      renderLayout()
      renderMain()
      return
    }
    renderLogin()
    return
  }
  // Verify token is still valid
  const r = await api('POST', '/api/admin/auth/check')
  if (!r.ok) { token = null; sessionStorage.removeItem('admin_token'); render(); return }
  renderLayout()
  renderMain()
}

/* ── Main Content ── */
async function renderMain() {
  const el = document.getElementById('main-content')
  if (!el) return
  switch (currentTab) {
    case 'dashboard': renderDashboard(el); break
    case 'versions': renderVersions(el); break
    case 'players': renderPlayers(el); break
    case 'blog': renderBlog(el); break
    case 'news': renderNews(el); break
  }
}

/* ── Dashboard ── */
async function renderDashboard(el) {
  const [stats, versions] = await Promise.all([
    api('GET', '/api/admin/stats'),
    api('GET', '/api/admin/versions').catch(() => []),
  ])
  const verCount = Array.isArray(versions) ? versions.length : 0
  el.innerHTML = `
    <div class="page-title">Dashboard</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Players</div><div class="stat-value">${stats.players || 0}</div></div>
      <div class="stat-card"><div class="stat-label">Online</div><div class="stat-value">${stats.online || 0}</div></div>
      <div class="stat-card"><div class="stat-label">News Posts</div><div class="stat-value">${stats.news || 0}</div></div>
      <div class="stat-card"><div class="stat-label">Blog Posts</div><div class="stat-value">${stats.blog || 0}</div></div>
      <div class="stat-card"><div class="stat-label">Versions</div><div class="stat-value">${verCount}</div></div>
      <div class="stat-card"><div class="stat-label">Version Banners</div><div class="stat-value">${stats.banners || 0}</div></div>
    </div>
    <p style="font-size:12px;color:rgba(255,255,255,0.2)">Logged in via Discord &middot; Server: ${API}</p>
  `
}

/* ── Versions ── */
const VERSIONS = [
  { id:'1.21.4', name:'The Garden Awakens' }, { id:'1.21.3', name:'Bundles of Bravery' },
  { id:'1.21.1', name:'Tricky Trials' }, { id:'1.21', name:'Tricky Trials' },
  { id:'1.20.6', name:'Armored Paws' }, { id:'1.20.4', name:'Trails & Tales' },
  { id:'1.20.1', name:'Trails & Tales' }, { id:'1.19.4', name:'Trails & Tales' },
  { id:'1.19.2', name:'Wild Update' }, { id:'1.18.2', name:'Caves & Cliffs' },
  { id:'1.17.1', name:'Caves & Cliffs' }, { id:'1.16.5', name:'Nether Update' },
  { id:'1.15.2', name:'Buzzy Bees' }, { id:'1.14.4', name:'Village & Pillage' },
  { id:'1.13.2', name:'Update Aquatic' }, { id:'1.12.2', name:'World of Color' },
  { id:'1.11.2', name:'Exploration Update' }, { id:'1.10.2', name:'Frostburn Update' },
  { id:'1.9.4', name:'Combat Update' }, { id:'1.8.9', name:'Bountiful Update' },
]

async function renderVersions(el) {
  const [banners, versionMeta] = await Promise.all([
    api('GET', '/api/admin/banners'),
    api('GET', '/api/admin/versions').catch(() => []),
  ])
  const bannerMap = {}
  if (Array.isArray(banners)) banners.forEach(b => { bannerMap[b.version] = b.image })
  const metaMap = {}
  ;(Array.isArray(versionMeta) ? versionMeta : []).forEach(v => { metaMap[v.id] = v })

  el.innerHTML = `
    <div class="page-title">Version Manager</div>
    <div class="list-header"><h3>${VERSIONS.length} versions</h3><button class="btn btn-primary" onclick="showVersionForm()">+ Add Version</button></div>
    <div class="ver-grid">
      ${VERSIONS.map(v => {
        const m = metaMap[v.id]
        const img = bannerMap[v.id] ? `${API}${bannerMap[v.id]}` : null
        const color = m ? m.color : '#60a5fa'
        return `<div class="ver-card">
          <div class="ver-card-preview"${img ? ` style="background-image:url('${img}')"` : ` style="background:linear-gradient(135deg,${color}22,${color}44)"`}>${img ? '' : v.id}</div>
          <div class="ver-card-body">
            <h4 style="color:${color}">${v.id}</h4>
            <p>${esc(m ? m.sub : v.name)}</p>
            <div class="ver-actions">
              <button class="btn btn-sm" style="background:rgba(255,255,255,0.05)" onclick="showVersionForm('${v.id}')">Edit</button>
              <label class="btn btn-sm" style="background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.2);cursor:pointer">${img ? 'Change' : 'Upload'} Banner <input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="uploadBanner('${v.id}', this)" /></label>
              ${img ? `<button class="btn btn-danger btn-sm" onclick="deleteBanner('${v.id}')">Remove</button>` : ''}
              <button class="btn btn-danger btn-sm" onclick="deleteVersion('${v.id}')">Delete</button>
            </div>
          </div>
        </div>`
      }).join('')}
    </div>
  `
}

function showVersionForm(editId) {
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.id = 'version-modal'
  overlay.innerHTML = `<div class="modal">
    <h3>${editId ? 'Edit Version' : 'Add Version'}</h3>
    ${!editId ? '<div class="form-group"><label>Version ID</label><input id="v-id" placeholder="e.g. 1.22" /></div>' : `<input type="hidden" id="v-id" value="${editId}" />`}
    <div class="form-group"><label>Label (display name)</label><input id="v-label" placeholder="e.g. 1.22" value="${editId || ''}" /></div>
    <div class="form-group"><label>Subtitle</label><input id="v-sub" placeholder="e.g. The Next Update" /></div>
    <div class="form-group"><label>Accent Color</label><div style="display:flex;gap:8px;align-items:center"><input id="v-color" type="color" value="#60a5fa" style="width:50px;height:40px;padding:2px;background:none;border:1px solid rgba(255,255,255,0.1);border-radius:6px;cursor:pointer" /><input id="v-color-text" placeholder="#60a5fa" style="flex:1" oninput="document.getElementById('v-color').value=this.value" /></div></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveVersion('${editId || ''}')">${editId ? 'Save' : 'Add'}</button>
      <button class="btn" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)" onclick="closeModal('version-modal')">Cancel</button>
    </div>
  </div>`
  document.body.appendChild(overlay)
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal('version-modal') })

  // If editing, pre-fill from saved metadata
  if (editId) {
    api('GET', '/api/admin/versions').then(list => {
      const m = (Array.isArray(list) ? list : []).find(x => x.id === editId)
      if (!m) return
      document.getElementById('v-label').value = m.label || m.id
      document.getElementById('v-sub').value = m.sub || ''
      if (m.color) {
        document.getElementById('v-color').value = m.color
        document.getElementById('v-color-text').value = m.color
      }
    })
  }
  // Sync color picker ↔ text input
  setTimeout(() => {
    const cp = document.getElementById('v-color');
    const ct = document.getElementById('v-color-text');
    if (cp && ct) {
      cp.addEventListener('input', () => ct.value = cp.value)
      ct.addEventListener('input', () => cp.value = ct.value)
    }
  }, 0)
}

async function saveVersion(editId) {
  const data = {
    id: document.getElementById('v-id') ? document.getElementById('v-id').value : editId,
    label: document.getElementById('v-label').value,
    sub: document.getElementById('v-sub').value,
    color: document.getElementById('v-color').value || document.getElementById('v-color-text').value,
  }
  if (editId) {
    await api('PUT', `/api/admin/versions/${editId}`, { label: data.label, sub: data.sub, color: data.color })
  } else {
    await api('POST', '/api/admin/versions', data)
  }
  closeModal('version-modal')
  renderVersions(document.getElementById('main-content'))
}

async function deleteVersion(id) {
  if (!confirm(`Delete version ${id}? This only removes the metadata entry, not the banner file.`)) return
  await api('DELETE', `/api/admin/versions/${id}`)
  renderVersions(document.getElementById('main-content'))
}

async function uploadBanner(version, input) {
  const file = input.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = async e => {
    const r = await api('PUT', `/api/admin/banners/${version}`, { image: e.target.result })
    if (r.error) { alert('Upload failed: ' + r.error); return }
    renderVersions(document.getElementById('main-content'))
  }
  reader.readAsDataURL(file)
}

async function deleteBanner(version) {
  if (!confirm(`Remove banner for ${version}?`)) return
  await api('DELETE', `/api/admin/banners/${version}`)
  renderVersions(document.getElementById('main-content'))
}

/* ── Players / Cosmetics ── */
async function renderPlayers(el) {
  const players = await api('GET', '/api/admin/players')
  el.innerHTML = `
    <div class="page-title">Players & Cosmetics</div>
    <div style="margin-bottom:16px"><input id="player-search" placeholder="Search by username or UUID..." style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 14px;font-size:13px;color:#e0e0e0;outline:none" oninput="renderPlayerList()" /></div>
    <div id="player-list"></div>
  `
  renderPlayerList()
  // Enable real-time search
  setTimeout(() => document.getElementById('player-search')?.addEventListener('input', () => renderPlayerList()), 0)
}

let _allPlayers = []
async function renderPlayerList() {
  const el = document.getElementById('player-list')
  if (!el) return
  const q = (document.getElementById('player-search')?.value || '').toLowerCase()
  if (!_allPlayers.length) _allPlayers = await api('GET', '/api/admin/players')
  const filtered = q ? _allPlayers.filter(p => p.username.toLowerCase().includes(q) || (p.uuid || '').toLowerCase().includes(q)) : _allPlayers
  el.innerHTML = `
    <div style="font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:8px">${filtered.length} player${filtered.length === 1 ? '' : 's'}</div>
    <div class="card-list">
      ${filtered.length === 0 ? '<div class="empty-state"><p>No players found</p></div>' : ''}
      ${filtered.map(p => {
        const c = p.cosmetics || {}
        return `<div class="card-row">
          <div style="flex:1;min-width:0">
            <strong>${esc(p.username)}</strong>
            <div style="font-size:11px;color:rgba(255,255,255,0.15);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ID: ${p.playerId.slice(0,8)}… &middot; UUID: ${(p.uuid || '').slice(0,8)}… &middot; Joined ${new Date(p.createdAt).toLocaleDateString()}
              ${c.theme ? ' &middot; Theme: ' + c.theme : ''}
              ${c.bgUrl ? ' &middot; BG: yes' : ''}
            </div>
          </div>
          <span style="font-size:10px;color:${p.online ? 'rgba(74,222,128,0.6)' : 'rgba(255,255,255,0.15)'};margin-right:8px">${p.online ? '● Online' : '○ Offline'}</span>
          <button class="btn btn-sm" style="background:rgba(255,255,255,0.05)" onclick="showCosmeticsForm('${p.playerId}')">Cosmetics</button>
        </div>`
      }).join('')}
    </div>
  `
}

function showCosmeticsForm(playerId) {
  const p = _allPlayers.find(x => x.playerId === playerId)
  if (!p) return
  Promise.all([
    api('GET', '/api/admin/cosmetics'),
    api('GET', '/api/cosmetics?playerId=' + playerId),
  ]).then(([defs, state]) => {
    const stateMap = {}
    if (Array.isArray(state)) state.forEach(s => { stateMap[s.id] = s.enabled })
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.id = 'cosmetics-modal'
    overlay.innerHTML = `<div class="modal" style="width:560px">
      <h3>Cosmetics &mdash; ${esc(p.username)}</h3>
      <p style="font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:16px">Toggle cosmetics on/off for this player</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${(Array.isArray(defs) ? defs : []).map(d => {
          const on = stateMap[d.id] === true
          return `<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 14px">
            <label style="position:relative;width:38px;height:22px;flex-shrink:0;cursor:pointer">
              <input type="checkbox" style="display:none" ${on ? 'checked' : ''} onchange="toggleCosmetic('${playerId}','${d.id}',this.checked)" />
              <span style="position:absolute;inset:0;background:${on ? 'rgba(74,222,128,0.3)' : 'rgba(255,255,255,0.08)'};border-radius:11px;border:1px solid ${on ? 'rgba(74,222,128,0.4)' : 'rgba(255,255,255,0.1)'};transition:all 0.15s">
                <span style="position:absolute;top:2px;left:${on ? '18px' : '2px'};width:16px;height:16px;border-radius:50%;background:${on ? '#4ade80' : 'rgba(255,255,255,0.3)'};transition:all 0.15s"></span>
              </span>
            </label>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:500">${esc(d.name)}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.2)">${esc(d.desc || d.type)}</div>
            </div>
            <span style="font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:0.3px">${d.type}</span>
          </div>`
        }).join('')}
        ${(!Array.isArray(defs) || defs.length === 0) ? '<div class="empty-state"><p>No cosmetics defined yet.</p></div>' : ''}
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end">
        <button class="btn" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)" onclick="closeModal('cosmetics-modal')">Close</button>
      </div>
    </div>`
    document.body.appendChild(overlay)
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal('cosmetics-modal') })
  })
}

async function toggleCosmetic(playerId, cosmeticId, enabled) {
  await api('PUT', `/api/admin/players/${playerId}/cosmetics`, { cosmeticId, enabled })
  const p = _allPlayers.find(x => x.playerId === playerId)
  if (p) {
    if (!p.cosmetics) p.cosmetics = {}
    p.cosmetics[cosmeticId] = enabled
  }
}

async function deleteCosmetic(id) {
  if (!confirm(`Delete cosmetic "${id}"? This will not remove it from players, just the definition.`)) return
  await api('DELETE', `/api/admin/cosmetics/${id}`)
}

/* ── Blog ── */
async function renderBlog(el) {
  const posts = await api('GET', '/api/admin/blog')
  el.innerHTML = `
    <div class="page-title">Blog Posts</div>
    <div class="list-header"><h3>${posts.length} posts</h3><button class="btn btn-primary" onclick="showBlogForm()">+ New Post</button></div>
    <div class="card-list">
      ${posts.length === 0 ? '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No blog posts yet</p></div>' : ''}
      ${posts.map(p => `<div class="card-row">
        <div style="flex:1"><strong>${esc(p.title)}</strong><div style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:2px">${new Date(p.createdAt).toLocaleDateString()} &middot; ${esc(p.excerpt || '').slice(0,80)}</div></div>
        <button class="btn btn-danger btn-sm" onclick="deleteBlog('${p.id}')">Delete</button>
      </div>`).join('')}
    </div>
  `
}

function showBlogForm() {
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.id = 'blog-modal'
  overlay.innerHTML = `<div class="modal">
    <h3>New Blog Post</h3>
    <div class="form-group"><label>Title</label><input id="blog-title" placeholder="Post title" /></div>
    <div class="form-group"><label>Excerpt</label><input id="blog-excerpt" placeholder="Short summary" /></div>
    <div class="form-group"><label>Image (optional)</label><div style="font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:4px">Upload from PC or paste a URL</div>
      <div style="display:flex;gap:8px">
        <label style="flex:1;padding:10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.12);text-align:center;font-size:12px;cursor:pointer;background:rgba(255,255,255,0.02);transition:all 0.12s" id="blog-upload-label" onmouseover="this.style.borderColor='rgba(255,255,255,0.25)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.12)'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block;margin:0 auto 4px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Choose File
          <input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" id="blog-image-file" onchange="setBlogImage(this)" />
        </label>
        <span style="color:rgba(255,255,255,0.1);align-self:center">or</span>
        <input id="blog-image-url" placeholder="Paste URL..." style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;font-size:13px;color:#e0e0e0;outline:none" />
      </div>
      <div id="blog-image-preview" style="margin-top:6px;display:none"></div>
    </div>
    <div class="form-group"><label>Tags (comma separated)</label><input id="blog-tags" placeholder="update, news" /></div>
    <div class="form-group"><label>Content</label><textarea id="blog-content" placeholder="Write your post..."></textarea></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="createBlog()">Publish</button>
      <button class="btn" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)" onclick="closeModal('blog-modal')">Cancel</button>
    </div>
  </div>`
  document.body.appendChild(overlay)
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal('blog-modal') })
  // Reset state
  window._blogImageBase64 = ''
}

function setBlogImage(input) {
  const file = input.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    window._blogImageBase64 = e.target.result
    document.getElementById('blog-image-url').value = ''
    const preview = document.getElementById('blog-image-preview')
    preview.innerHTML = `<img src="${e.target.result}" style="max-height:80px;border-radius:6px" />`
    preview.style.display = 'block'
    document.getElementById('blog-upload-label').innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block;margin:0 auto 2px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Change File<input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" id="blog-image-file" onchange="setBlogImage(this)" />`
  }
  reader.readAsDataURL(file)
}

async function createBlog() {
  const imageFile = window._blogImageBase64 || ''
  const imageUrl = document.getElementById('blog-image-url').value
  await api('POST', '/api/admin/blog', {
    title: document.getElementById('blog-title').value,
    content: document.getElementById('blog-content').value,
    excerpt: document.getElementById('blog-excerpt').value,
    image: imageUrl,
    imageFile: imageFile,
    tags: document.getElementById('blog-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
  })
  window._blogImageBase64 = ''
  closeModal('blog-modal'); renderBlog(document.getElementById('main-content'))
}

async function deleteBlog(id) { if (!confirm('Delete this post?')) return; await api('DELETE', `/api/admin/blog/${id}`); renderBlog(document.getElementById('main-content')) }

/* ── News ── */
async function renderNews(el) {
  const all = await api('GET', '/api/admin/news')
  const items = Array.isArray(all) ? all : (all.news || [])
  el.innerHTML = `
    <div class="page-title">News</div>
    <div class="list-header"><h3>${items.length} items</h3><button class="btn btn-primary" onclick="showNewsForm()">+ New News</button></div>
    <div class="card-list">
      ${items.length === 0 ? '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p>No news yet</p></div>' : ''}
      ${items.map(n => `<div class="card-row">
        <div style="flex:1"><strong>${esc(n.title)}</strong><div style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:2px">${new Date(n.createdAt).toLocaleDateString()} &middot; <span style="color:rgba(96,165,250,0.6)">${esc(n.tag || 'Update')}</span></div></div>
        <button class="btn btn-danger btn-sm" onclick="deleteNews('${n.id}')">Delete</button>
      </div>`).join('')}
    </div>
  `
}

function showNewsForm() {
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.id = 'news-modal'
  overlay.innerHTML = `<div class="modal">
    <h3>New News Item</h3>
    <div class="form-group"><label>Title</label><input id="news-title" placeholder="News title" /></div>
    <div class="form-group"><label>Text</label><textarea id="news-text" placeholder="News content"></textarea></div>
    <div class="form-group"><label>Tag</label><select id="news-tag"><option>Update</option><option>Announcement</option><option>Event</option><option>Maintenance</option></select></div>
    <div class="form-group"><label>Image URL</label><input id="news-image" placeholder="https://..." /></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="createNews()">Publish</button>
      <button class="btn" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5)" onclick="closeModal('news-modal')">Cancel</button>
    </div>
  </div>`
  document.body.appendChild(overlay)
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal('news-modal') })
}

async function createNews() {
  await api('POST', '/api/admin/news', {
    title: document.getElementById('news-title').value,
    text: document.getElementById('news-text').value,
    tag: document.getElementById('news-tag').value,
    image: document.getElementById('news-image').value,
  })
  closeModal('news-modal'); renderNews(document.getElementById('main-content'))
}

async function deleteNews(id) { if (!confirm('Delete this news item?')) return; await api('DELETE', `/api/admin/news/${id}`); renderNews(document.getElementById('main-content')) }

function closeModal(id) { const el = document.getElementById(id); if (el) el.remove() }

document.addEventListener('DOMContentLoaded', render)
</script>
</body>
</html>
